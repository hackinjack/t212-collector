[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t212-collector"
version = "0.2.0"
description = "Self-hosted Trading 212 portfolio collector"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "flask>=3.1,<4",
]

[project.scripts]
t212-collector = "t212_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
